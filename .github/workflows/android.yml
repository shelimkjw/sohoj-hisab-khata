name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check Android SDK (pre-installed on GitHub runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK not found"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Run accounting tests
        run: bunx vitest run src/test/ledger.test.ts

      - name: Build web app (single-page mode for Android)
        run: CAPACITOR=1 bun run build

      - name: Collect web files into www/
        run: |
          set -e
          SHELL_HTML=$(find dist .output -name "_shell.html" -o -name "index.html" 2>/dev/null | grep -v node_modules | head -1)
          if [ -z "$SHELL_HTML" ]; then echo "::error::No HTML entry found in build output"; find dist .output -maxdepth 3 | head -50; exit 1; fi
          CLIENT_DIR=$(dirname "$SHELL_HTML")
          echo "Using $CLIENT_DIR"
          rm -rf www && mkdir www
          cp -r "$CLIENT_DIR"/. www/
          cp "$SHELL_HTML" www/index.html
          ls -la www

      - name: Generate app icon and splash
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#1f6b45' --splashBackgroundColor '#1f6b45' --iconBackgroundColorDark '#1f6b45' --splashBackgroundColorDark '#1f6b45'

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: Verify and rename debug APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK" || { echo "::error::Debug APK was not produced"; exit 1; }
          mv "$APK" android/app/build/outputs/apk/debug/sohoj-hisab-khata-debug.apk
          ls -la android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: sohoj-hisab-khata-debug-apk
          path: android/app/build/outputs/apk/debug/sohoj-hisab-khata-debug.apk

      - name: Build signed release APK (only if signing secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: android
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/sohoj-hisab-khata.apk

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/apk/release/sohoj-hisab-khata.apk') != '' }}
        with:
          name: sohoj-hisab-khata-release-apk
          path: android/app/build/outputs/apk/release/sohoj-hisab-khata.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: সহজ হিসাব খাতা v${{ github.run_number }}
          files: |
            android/app/build/outputs/apk/debug/sohoj-hisab-khata-debug.apk
            android/app/build/outputs/apk/release/sohoj-hisab-khata.apk
